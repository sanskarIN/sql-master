name: Standalone SQL Projects - Python Tests

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - '.github/workflows/standalone-projects-python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/**'
      - '.github/workflows/standalone-projects-python.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project:
          - backup-manifest-verifier
          - data-quality-rule-runner
          - explain-plan-analyzer
          - migration-order-checker
          - schema-quality-auditor
          - sql-query-practice-lab
          - sqlite-booking-calendar
          - sqlite-inventory-manager
          - synthetic-data-factory
          - transaction-invariant-simulator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run project tests
        working-directory: projects/${{ matrix.project }}
        run: python -m unittest discover -s tests -v
