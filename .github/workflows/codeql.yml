name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'code/**'
      - 'projects/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'code/**'
      - 'projects/**'
      - '.github/workflows/**'
  schedule:
    - cron: '19 1 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
