name: Repository Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q scripts projects code tests
      - name: Run repository-tool regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository structure and metadata
        run: python scripts/validate_repository.py
      - name: Validate repository-relative Markdown links
        run: python scripts/check_relative_links.py
      - name: Smoke-test standalone project metadata
        run: python scripts/run_all_tests.py --standalone
